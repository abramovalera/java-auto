# Запуск:   docker compose up -d --build
# Открыть:  http://localhost:7070
# Стоп:     docker compose down
services:
  course:
    build: .
    container_name: java-course
    ports:
      - "7070:7070"
    environment:
      TZ: Europe/Moscow          # часовой пояс для истории проверок
      COURSE_DIR: /app/course    # папка курса целиком: по .git сервер узнаёт, вышло ли обновление на GitHub
    volumes:
      - ./site:/app/site:ro      # сайт и уроки — правки видны без пересборки
      - ./tasks:/app/tasks:ro    # условия и тесты задач
      - ./workspace:/workspace   # ТВОИ данные: код, прогресс, история проверок
      - ./starter:/app/starter:ro  # заготовки задач — копируются в workspace, только если файла там нет
      - .:/app/course:ro         # вся папка курса только для чтения — проверка обновлений (значок «🔄 Обновление»)
    restart: unless-stopped
